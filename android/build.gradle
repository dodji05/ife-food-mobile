buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.3.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.gms:google-services:4.4.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Force ExoPlayer 2.19.1 — la 2.18.7 crashe avec R8 sur AGP 8.x
subprojects {
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.google.android.exoplayer2') {
                details.useVersion '2.19.1'
            }
        }
    }
}

// Supprime -Werror de tous les plugins Flutter (warnings Java 8 obsolètes non bloquants)
allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.removeAll { it == '-Werror' }
        options.compilerArgs << '-Xlint:-options'
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
