// AGP / Kotlin / google-services : déclarés via le plugins{} DSL dans
// settings.gradle.kts (id "com.android.application" version "8.11.1", etc.)
// — pas de buildscript{} classpath ici, ça créerait un doublon de version.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Force ExoPlayer 2.19.1 — la 2.18.7 crashe avec R8 sur AGP 8.x
subprojects {
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.google.android.exoplayer2') {
                details.useVersion '2.19.1'
            }
        }
    }
}

// Supprime -Werror de tous les plugins Flutter (warnings Java 8 obsolètes non bloquants)
allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.removeAll { it == '-Werror' }
        options.compilerArgs << '-Xlint:-options'
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
